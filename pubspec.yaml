name: vibecall
description: A modern dating + random video calling app with premium UI/UX.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  provider: ^6.1.1

  # Navigation
  go_router: ^13.0.0

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.7.10

  # Video Calling (WebRTC P2P)
  flutter_webrtc: ^0.11.6
  permission_handler: ^11.1.0

  # UI
  google_fonts: ^6.1.0
  flutter_animate: ^4.3.0
  lottie: ^3.0.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  glassmorphism_ui: ^0.3.0
  flutter_svg: ^2.0.9
  card_swiper: ^3.0.1
  swipe_cards: ^2.0.0
  flutter_card_swiper: ^6.0.0

  # Auth
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  flutter_facebook_auth: ^6.0.4

  # Utils
  intl: ^0.19.0
  uuid: ^4.2.2
  image_picker: ^1.0.7
  share_plus: ^7.2.1
  url_launcher: ^6.2.2
  shared_preferences: ^2.2.2
  dio: ^5.4.0
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1
  equatable: ^2.0.5
  flutter_local_notifications: ^16.1.0
  in_app_purchase: ^3.1.13
  country_picker: ^2.0.21
  emoji_picker_flutter: ^1.6.3
  giphy_picker: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  freezed: ^2.4.5
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottie/
    - assets/animations/

  # Fonts: Using google_fonts package (auto-downloads Poppins)

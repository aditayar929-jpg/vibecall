name: Build VibeCall APK + AAB

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # Manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      # ─── Fix corrupted launcher icons ──────────────────────
      - name: Generate launcher icons
        run: |
          pip install Pillow
          mkdir -p assets/images
          python3 -c "
          from PIL import Image, ImageDraw, ImageFont
          size = 1024
          img = Image.new('RGB', (size, size), '#7B2FFF')
          draw = ImageDraw.Draw(img)
          try:
              font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', 550)
          except:
              font = ImageFont.load_default()
          bbox = draw.textbbox((0, 0), 'V', font=font)
          tw, th = bbox[2]-bbox[0], bbox[3]-bbox[1]
          draw.text(((size-tw)//2, (size-th)//2-40), 'V', fill='white', font=font)
          img.save('assets/images/app_icon.png')
          print('Done')
          "
          rm -f android/app/src/main/res/mipmap-*/ic_launcher.png
          rm -f android/app/src/main/res/mipmap-*/ic_launcher_round.png
          rm -f android/app/src/main/res/mipmap-*/ic_launcher_foreground.png
          dart run flutter_launcher_icons

      - name: Check for analysis issues
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      # ─── Setup Signing (if secrets available) ──────────────
      - name: Decode Keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/vibecall-release.jks

      - name: Create key.properties
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=vibecall-release.jks
          EOF

      # ─── Debug APK ─────────────────────────────────────────
      - name: Build APK (debug)
        run: flutter build apk --debug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vibecall-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      # ─── Release APK ───────────────────────────────────────
      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: vibecall-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # ─── AAB for Play Store ────────────────────────────────
      - name: Build AAB (release)
        run: flutter build appbundle --release

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: vibecall-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      # ─── Create GitHub Release on tag push ─────────────────
      - name: Create Release (if tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
